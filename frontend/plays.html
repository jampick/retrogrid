<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>RETRO//FFB · play grammar contact sheet</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: var(--ffb-bg, #0a0a12); color: var(--ffb-dim, #889); font: 11px/1.35 var(--ffb-font, ui-monospace), ui-monospace, monospace; }
  header { position: sticky; top: 0; z-index: 2; display: flex; gap: 14px; align-items: center; padding: 6px 10px;
           background: var(--ffb-rail, #111); border-bottom: 1px solid var(--ffb-grid, #334); letter-spacing: .08em; text-transform: uppercase; }
  header b { color: var(--ffb-hot, #fff); }
  #families { display: flex; flex-wrap: wrap; gap: 4px; }
  button { font: inherit; letter-spacing: inherit; text-transform: inherit; color: var(--ffb-dim); background: none;
           border: 1px solid var(--ffb-grid, #334); padding: 2px 6px; cursor: pointer; }
  button em { font-style: normal; opacity: .6; margin-left: 5px; }
  button.on { color: var(--ffb-bg); background: var(--ffb-you, #4cf); border-color: var(--ffb-you, #4cf); }
  #status { margin-left: auto; white-space: nowrap; }
  #keys { opacity: .7; white-space: nowrap; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, 240px); gap: 12px 10px; padding: 10px; justify-content: center; }
  figure { margin: 0; width: 240px; cursor: zoom-in; border: 1px solid transparent; }
  figure:hover { border-color: var(--ffb-grid); }
  figure.flagged { border-color: var(--ffb-alert, #f44); }
  canvas { display: block; image-rendering: pixelated; }
  figcaption { padding: 3px 2px; height: 56px; overflow: hidden; }
  figcaption b { color: var(--ffb-hot); text-transform: uppercase; letter-spacing: .08em; }
  figcaption span { float: right; color: var(--ffb-you); }
  figcaption p { margin: 2px 0 0; max-height: 2.7em; overflow: hidden; }
  figcaption i { color: var(--ffb-alert); font-style: normal; }
  #zoom { position: fixed; inset: 0; z-index: 5; display: flex; gap: 24px; padding: 20px; box-sizing: border-box;
          background: var(--ffb-bg, #0a0a12); }
  #zoom[hidden] { display: none; }
  #zinfo { max-width: 640px; font-size: 13px; }
  #zinfo h1 { margin: 0; font-size: 22px; color: var(--ffb-hot); text-transform: uppercase; letter-spacing: .1em; }
  #zinfo h2 { margin: 4px 0 14px; font-size: 13px; font-weight: normal; color: var(--ffb-you); }
  #zinfo p { color: var(--ffb-hot); } #zinfo p.k, #zinfo p.keys { color: var(--ffb-dim); } #zinfo p.flag { color: var(--ffb-alert); }
  #zinfo p.keys { margin-top: 30px; }
  #note { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%); z-index: 9; width: 520px; font: inherit; font-size: 14px;
          padding: 8px; color: var(--ffb-hot); background: var(--ffb-rail); border: 1px solid var(--ffb-alert); outline: none; }
</style></head><body>
<header><b>RETRO//FFB · GRAMMAR</b><div id="families"></div><span id="status"></span>
  <span id="keys">[R] reroll · [S] diagram · [SPACE] pause · [1/2/3] speed · click = zoom</span></header>
<main id="grid"></main>
<div id="zoom" hidden><canvas id="zcanvas"></canvas><div id="zinfo"></div></div>
<input id="note" hidden placeholder="what looks wrong? ENTER saves, ESC cancels">
<script src="/dist/sheet.js"></script>
</body></html>
