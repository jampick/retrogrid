[project]
name = "retroffb"
version = "0.1.0"
description = "Cyberpunk fantasy football threat console"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pandas",
  "pyarrow",
  "pillow",
  "numpy",
  "httpx",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
